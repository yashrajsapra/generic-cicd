name: PR Pipeline
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  pipeline:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/cicd-pipeline.yml
    with:
      pr-number: ${{ github.event.number }}
      blocking: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
